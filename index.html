<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fake or Real?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--text:#1B1F5E;--muted:#555a8f;--bg:#F4F6FF;--card:#fff;--line:#1B1F5E;--blue:#3A5BFF;--pink:#FF4F8B;--mint:#22C97F;--sun:#FFC933;
 --display:'Bricolage Grotesque','Poppins','Segoe UI',system-ui,sans-serif;--body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--text:#EEF0FF;--muted:#AEB3E6;--bg:#12153F;--card:#1E2360;--line:#070920}}
:root[data-theme="dark"]{--text:#EEF0FF;--muted:#AEB3E6;--bg:#12153F;--card:#1E2360;--line:#070920}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05}
.wrap{max-width:720px;margin:0 auto;padding:18px 18px 48px}
.present .wrap{max-width:1100px}
.hud{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.hud .t{flex:1;font-family:var(--display);font-weight:800;font-size:20px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:2.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;box-shadow:3px 3px 0 var(--line)}
.title{font-family:var(--display);font-weight:800;line-height:.85;letter-spacing:-.04em;margin:20px 0 18px}
.title .f{display:inline-block;background:var(--pink);color:#1B1F5E;border:4px solid var(--line);border-radius:18px;padding:0 .18em .06em;transform:rotate(-4deg);font-size:clamp(70px,20vw,140px);box-shadow:7px 7px 0 var(--line)}
.title .o{display:block;font-size:clamp(30px,8vw,48px);margin:.45em 0 .35em .6em;color:var(--muted)}
.title .r{display:inline-block;background:var(--mint);color:#1B1F5E;border:4px solid var(--line);border-radius:18px;padding:0 .18em .06em;transform:rotate(3deg);font-size:clamp(70px,20vw,140px);box-shadow:7px 7px 0 var(--line);margin-left:.4em}
.lede{font-size:20px;color:var(--muted);max-width:36ch}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:560px){.choices{grid-template-columns:1fr}}
.choice{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;text-align:left;box-shadow:6px 6px 0 var(--line)}
.choice:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.choice .e{font-size:40px;line-height:1}
.choice h3{font-size:24px;margin:8px 0 4px}
.choice p{margin:0;font-size:16px;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:3px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px}
.seg button{border:0;background:var(--card);padding:8px 14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.stage{position:relative;perspective:900px}
.frame{background:var(--sun);border:3px solid var(--line);border-radius:28px;padding:18px;box-shadow:8px 8px 0 var(--line);position:relative}
.frame .meta{display:flex;justify-content:space-between;font-weight:700;color:#1B1F5E;font-size:15px;margin-bottom:10px}
.present .frame .m{font-size:30px}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-12deg) scale(1);font-family:var(--display);font-weight:800;font-size:clamp(64px,17vw,120px);padding:0 .2em;border:6px solid currentColor;border-radius:18px;background:rgba(255,255,255,.88);animation:slam .35s cubic-bezier(.2,1.8,.5,1);pointer-events:none}
.stamp.fake{color:#D6195B}.stamp.real{color:#0B8F58}
@keyframes slam{from{transform:translate(-50%,-50%) rotate(-12deg) scale(2.6);opacity:0}}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.vote{border:3px solid var(--line);border-radius:20px;padding:16px 10px;font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);box-shadow:6px 6px 0 var(--line);color:#1B1F5E}
.vote:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.vote.fk{background:var(--pink)}.vote.rl{background:var(--mint)}
.reveal{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;margin-top:18px;box-shadow:6px 6px 0 var(--line)}
.reveal h2{font-size:clamp(26px,6vw,36px);margin-bottom:8px}
.reveal ul{margin:6px 0 10px;padding-left:22px}
.reveal li{margin:4px 0}
.present .reveal{font-size:24px}
.lesson{background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:700}
.big{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:3px solid var(--line);border-radius:16px;padding:13px 22px;font-family:var(--display);font-weight:800;font-size:21px;box-shadow:5px 5px 0 var(--line);margin-top:16px}
.big.alt{background:var(--card);color:var(--text)}
.big:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.team{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.team .n{font-weight:700}.team .s{font-family:var(--display);font-weight:800;font-size:48px;line-height:1}
.team button{border:3px solid var(--line);border-radius:12px;background:var(--sun);color:#1B1F5E;font-weight:800;padding:6px 14px;margin:4px}
.score{font-family:var(--display);font-weight:800;font-size:clamp(80px,22vw,150px);line-height:1;letter-spacing:-.04em}
.missed{display:grid;gap:10px;margin-top:10px}
.missed div{background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:10px 12px}
.hidden{display:none!important}
.hint{color:var(--muted);font-size:15px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.m{font-family:-apple-system,'Segoe UI',Roboto,'DejaVu Sans',sans-serif;color:#1c1c1e;background:#fff;border-radius:18px;padding:14px;text-align:left;font-size:1em;line-height:1.38}
.m-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.m-av{width:2.2em;height:2.2em;border-radius:50%;background:#8e8e93;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.m-av-grad{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}
.m-from{font-weight:700}
.m-sub{font-size:.8em;color:#6b6b70}
.m-bub{background:#e9e9eb;border-radius:18px 18px 18px 4px;padding:10px 13px;display:inline-block}
.m-link{color:#0a63d6;text-decoration:underline;word-break:break-all}
.m-btn{display:inline-block;background:#0a63d6;color:#fff;border-radius:6px;padding:2px 10px;margin:2px 2px;font-weight:700;font-size:.9em}
.m-ehead{border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:8px}
.m-addr{font-size:.82em;color:#6b6b70;word-break:break-all}
.m-subj{font-weight:700;margin-top:6px}
.m-game{background:#23262e;color:#e8e8ea}
.m-gbar{font-size:.8em;color:#9aa0ad;margin-bottom:8px}
.m-gname{color:#ffcc33;font-weight:700}
.m-game .m-link{color:#7fb2ff}
.m-pop{padding:0;overflow:hidden;border:2px solid #c62828}
.m-ptitle{background:#c62828;color:#fff;font-weight:700;padding:8px 12px}
.m-pbody{padding:12px;font-weight:600}
.m-pop .m-btn{background:#e5e5ea;color:#1c1c1e}
.m-push{background:#f2f2f7;border-radius:20px}
.m-ptop{display:flex;align-items:center;gap:8px;font-size:.8em;color:#6b6b70;margin-bottom:4px}
.m-icon{width:1.9em;height:1.9em;border-radius:7px;background:#1c1c1e;color:#fff;display:grid;place-items:center;font-weight:700}
.m-app{font-weight:700;text-transform:none;flex:1}
.m-pb{font-weight:500}
.m-url{background:#f2f2f7}
.m-dots{display:flex;gap:6px;margin-bottom:10px}.m-dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.m-dots i:nth-child(2){background:#febc2e}.m-dots i:nth-child(3){background:#28c840}
.m-bar{background:#fff;border:1px solid #d1d1d6;border-radius:10px;padding:9px 12px;font-family:'DejaVu Sans Mono',ui-monospace,Menlo,monospace;font-size:.92em;word-break:break-all}
.m-apptag{font-size:.75em;font-weight:700;color:#6b6b70;margin-bottom:6px}
.m-av-app{background:#8e8e93}
.m-ig .m-av-app{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)} .m-ig .m-apptag{color:#c13584}
.m-tt{background:#121212;color:#f1f1f2} .m-tt .m-apptag,.m-tt .m-sub{color:#a0a0a8} .m-tt .m-av-app,.m-push.m-tt .m-icon{background:#000;box-shadow:-2px -2px 0 #25F4EE,2px 2px 0 #FE2C55} .m-tt .m-bub{background:#2a2a2e;color:#f1f1f2} .m-tt .m-link{color:#6fc3ff}
.m-push.m-tt .m-ptop{color:#a0a0a8}
.m-tg .m-av-app{background:#2AABEE} .m-tg .m-apptag{color:#1c8fd1} .m-tg .m-bub{background:#e7f4fd}
.m-sc .m-av-app{background:#FFFC00;color:#000} .m-dc .m-av-app{background:#5865F2} .m-dc .m-apptag{color:#5865F2}
.m-fb .m-av-app{background:#1877F2} .m-yt .m-av-app{background:#FF0000}
.m-push.m-ig .m-icon{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}
.m-crow{display:flex;gap:10px;align-items:flex-start}
.m-vm .m-av{background:#34c759}
.m-wave{letter-spacing:2px;color:#34c759;font-size:1.2em;margin:4px 0 8px}
.m-vt{font-style:italic}

</style>
</head>

<script>
const CARDS=[{"id": 1, "kind": "sms", "from": "+1 (938) 555-0142", "body": "USPS: Your package is on hold due to an incomplete address. Update within 12 hours or it will be returned: usps-redeliver-help.top", "verdict": "fake", "who": "Everyone", "clues": ["USPS doesn't text links from random numbers", "Weird web address ending in .top", "Countdown pressure: 12 hours or else"], "lesson": "Track packages only in the official app or by typing the site yourself."}, {"id": 2, "kind": "sms", "from": "FasTrak", "body": "Unpaid toll balance of $6.99. Pay today to avoid a $50 late fee: fastrak-tollpay.info/ca", "verdict": "fake", "who": "Parents", "clues": ["Tiny amount + big scary fee is a classic hook", "The address isn't the real FasTrak site", "Toll agencies don't collect by text link"], "lesson": "Log in to your toll account directly. Never pay from a text link."}, {"id": 3, "kind": "sms", "from": "Unknown number", "body": "Hi Mom, I dropped my phone in the toilet 😩 this is my new number. Can you send $400 for a new one? Need it today, please don't call, the mic is broken", "verdict": "fake", "who": "Parents", "clues": ["New number + money request + urgency", "\"Don't call\" blocks you from checking", "No real name or detail only your kid would know"], "lesson": "Call the old number or ask your family code word before sending anything."}, {"id": 4, "kind": "sms", "from": "52790", "body": "Your Google verification code is 482913. Don't share it with anyone.", "verdict": "real", "who": "Everyone", "clues": ["Real only if YOU just tried to sign in", "No link, no request to reply", "Tells you not to share it"], "lesson": "A code you didn't ask for means someone has your password. Never share it, and change your password."}, {"id": 5, "kind": "dm", "app": "Instagram", "from": "maya.r_2011", "body": "omg is this you in this video?? 😳😳 bit.ly/3xVid-you", "verdict": "fake", "who": "Kids & Teens", "clues": ["Friend's account may be hacked", "Shock + curiosity makes you click fast", "Shortened link hides where it goes"], "lesson": "Ask your friend another way (text or in person) before clicking anything."}, {"id": 6, "kind": "game", "app": "Game chat", "from": "RBX_Admin_Official", "body": "🎁 CONGRATS! You were picked for 10,000 FREE Robux! Enter your username + password at free-rbx-gift.net to claim before midnight!", "verdict": "fake", "who": "Kids", "clues": ["Free currency = the #1 game scam", "Admins never ask for your password", "\"Before midnight\" rush"], "lesson": "Nobody real ever needs your password. Close it and tell a grown-up."}, {"id": 7, "kind": "email", "from": "Netflix Billing", "addr": "no-reply@netflix-account-verify.co", "subject": "Action required: payment declined", "body": "We couldn't process your last payment. Update your card within 24 hours or your membership will be cancelled. [Update Payment]", "verdict": "fake", "who": "Parents", "clues": ["Sender address is not netflix.com", "24-hour deadline", "Button asks for card details"], "lesson": "Open the Netflix app yourself to check billing. Don't use the button."}, {"id": 8, "kind": "email", "from": "Amazon.com", "addr": "auto-confirm@amazon.com", "subject": "Your order of \"USB-C cable, 2-pack\" has shipped", "body": "Arriving Thursday. Track your package in Your Orders. We'll never ask for your password by email.", "verdict": "real", "who": "Everyone", "clues": ["Real amazon.com sender", "Matches an order you actually placed", "No urgency, no login request"], "lesson": "Even when it looks real, check orders in the app, not the email link."}, {"id": 9, "kind": "popup", "from": "Windows Defender Security", "body": "⚠️ VIRUS DETECTED! Your computer is locked. Call Microsoft Support NOW at 1-888-555-0199. Do not close this window or your files will be deleted.", "verdict": "fake", "who": "Everyone", "clues": ["Real antivirus never shows a phone number", "Scary threats: files deleted", "Microsoft doesn't ask you to call"], "lesson": "Close the browser tab (or restart). Never call a number from a pop-up."}, {"id": 10, "kind": "push", "app": "Chase", "from": "Chase", "body": "Card ending 4417: $12.40 at SAFEWAY #1920 was approved.", "verdict": "real", "who": "Parents", "clues": ["Comes from the bank's own app", "Just information, no link or ask", "Matches something you bought"], "lesson": "App alerts are great. If you don't recognize a charge, call the number on your card."}, {"id": 11, "kind": "url", "from": "Browser", "body": "https://www.amaz0n-deals.shop/lightning-sale", "verdict": "fake", "who": "Teens & Parents", "clues": ["Zero instead of an O in amaz0n", "Ends in .shop, not amazon.com", "Too-good \"lightning sale\""], "lesson": "Read the address right before the first single slash. That's who you're really talking to."}, {"id": 12, "kind": "url", "from": "Browser", "body": "https://accounts.google.com/signin", "verdict": "real", "who": "Teens & Parents", "clues": ["The part right before the first / is google.com", "Your password manager autofills here", "Padlock alone doesn't prove it's real, the name does"], "lesson": "Let your password manager be your fake-site detector: it won't fill on look-alikes."}, {"id": 13, "kind": "dm", "app": "Snapchat", "from": "Team Snapchat Support", "body": "Your account was reported and will be deleted in 24h. To keep it, reply with the 6-digit code we just sent you.", "verdict": "fake", "who": "Kids & Teens", "clues": ["Support never DMs you for codes", "Deletion threat + deadline", "The code lets THEM log in as you"], "lesson": "A login code is like a house key. Never give it to anyone, ever."}, {"id": 14, "kind": "sms", "from": "+1 (415) 555-0187", "body": "Hi! I'm Jessica from a talent agency 😊 Earn $300-$500/day just liking YouTube videos from home. Reply YES to start!", "verdict": "fake", "who": "Teens", "clues": ["Easy money for almost nothing", "Random stranger texting you", "Later they ask YOU to pay to \"unlock\" earnings"], "lesson": "If a job pays to like videos, you're the product. Delete and block."}, {"id": 15, "kind": "push", "app": "Venmo", "from": "Venmo", "body": "Kevin M. sent you $1,200: \"sorry wrong person!! pls send back asap 🙏\"", "verdict": "fake", "who": "Teens & Parents", "clues": ["The payment often comes from a stolen card", "When it's reversed, your money is gone", "Pressure to act fast"], "lesson": "Don't send it back yourself. Contact Venmo support in the app and let them reverse it."}, {"id": 16, "kind": "email", "from": "Your School District", "addr": "notifications@schoolmessenger.com", "subject": "Minimum day reminder: Friday", "body": "Friday is a minimum day. Dismissal at 12:30 PM. No action needed.", "verdict": "real", "who": "Parents", "clues": ["Comes from the district's usual messaging service", "Nothing to click, sign, or pay", "Info you can double-check on the school site"], "lesson": "Real messages can be boring. Boring is a good sign."}, {"id": 17, "kind": "push", "app": "Password Manager", "from": "Password Manager", "body": "Watchtower: the password for your old Spotify login appeared in a data breach. Change it now.", "verdict": "real", "who": "Teens & Parents", "clues": ["Comes from your own password manager app", "Tells you to fix it, doesn't ask for anything", "Opens inside the app, not a link"], "lesson": "This is why a password manager rocks: it warns you when a password leaks."}, {"id": 18, "kind": "dm", "app": "Discord", "from": "xX_n1tro_Xx", "body": "yo free Nitro for 3 months, gift from the devs 🎉 discord-gifts.co/claim", "verdict": "fake", "who": "Kids & Teens", "clues": ["Stranger with a random name", "Look-alike address, not discord.com", "\"Free from the devs\" never happens"], "lesson": "Real gifts show up inside the app as a gift card, not a link from a stranger."}, {"id": 19, "kind": "popup", "from": "Google", "body": "Is it you trying to sign in? Device: Windows PC, Sacramento, CA. [No, it's not me] [Yes]", "verdict": "real", "who": "Everyone", "clues": ["Real if YOU are signing in right now", "If you're not: tap No, it's not me", "Someone asking again and again = attack"], "lesson": "Only tap Yes when it's you. Surprise prompt? Tap No and change your password."}, {"kind": "email", "addr": "service@paypa1-resolution.com", "subject": "Invoice #INV-58214: $899.00 to Coinbase", "body": "Thanks for your purchase! $899.00 in Bitcoin will be charged to your account today.\nDidn't authorize this? Call our Billing Team at 1-888-555-0133 within 24 hours to cancel.", "verdict": "fake", "who": "Parents", "clues": ["paypa1 with a number 1, not paypal.com", "Scary charge you never made", "Wants you to CALL them, where they'll ask for remote access"], "lesson": "Log in to PayPal yourself. Never call a number from a surprise invoice.", "id": 20, "from": "PayPal"}, {"kind": "email", "addr": "service@paypal.com", "subject": "You sent $25.00 USD to Jordan Lee", "body": "Hi Anna,\nYou sent a payment of $25.00 USD to Jordan Lee.\nNote: Concert tickets 🎶\nTransaction ID: 7HX29481PL", "verdict": "real", "who": "Teens & Parents", "clues": ["Real paypal.com sender", "Uses your actual name", "Matches a payment you made; asks for nothing"], "lesson": "A receipt for something you did is normal. A receipt for something you didn't do: check in the app.", "id": 21, "from": "PayPal"}, {"kind": "email", "addr": "geeksquad.billing2026@gmail.com", "subject": "Your 3-Year Protection Plan has been renewed", "body": "Order #GS-44120-7\nAmount: $349.99\nPayment: Auto-debit\nTo cancel and get a refund, call 1-877-555-0190 today.", "verdict": "fake", "who": "Parents", "clues": ["A big company doesn't email from @gmail.com", "You never bought this plan", "Refund by phone = they'll ask to 'fix' your bank account"], "lesson": "Delete. If worried, check your bank app, not the phone number in the email.", "id": 22, "from": "Geek Squad Renewal"}, {"kind": "email", "addr": "no-reply@meta-business-help.net", "subject": "Your account will be deleted in 48 hours", "body": "We received a copyright complaint about one of your posts.\nIf you think this is a mistake, submit an appeal or your account will be permanently removed.\n[Submit Appeal]", "verdict": "fake", "who": "Teens", "clues": ["Not from instagram.com or mail.instagram.com", "48-hour deadline", "The appeal page steals your login"], "lesson": "Real warnings show up inside the app under Settings > Account Status.", "id": 23, "from": "Instagram Copyright Team"}, {"kind": "email", "addr": "security@mail.instagram.com", "subject": "New login to Instagram from iPhone", "body": "Hi maya.r_2011,\nWe noticed a login from a device you don't usually use.\niPhone 15 · Folsom, CA\nIf this was you, you can ignore this message. If not, secure your account.", "verdict": "real", "who": "Kids & Teens", "clues": ["Real sender: mail.instagram.com", "Calls you by your username", "No deadline, doesn't ask for your password"], "lesson": "Even for real alerts, open the Instagram app yourself instead of tapping email buttons.", "id": 24, "from": "Instagram"}, {"kind": "email", "addr": "appleid@secure-apple-support.info", "subject": "Your Apple ID has been locked", "body": "Dear Customer,\nYour Apple ID was locked for security reasons. You must verify your information to unlock it.\n[Verify Now]", "verdict": "fake", "who": "Everyone", "clues": ["\"Dear Customer\" instead of your name", "Address ends in .info, not apple.com", "Button asks you to 'verify' info"], "lesson": "Go to Settings on your iPhone. If Apple needs something, it'll show there.", "id": 25, "from": "Apple Support"}, {"kind": "email", "addr": "no_reply@email.apple.com", "subject": "Your receipt from Apple", "body": "iCloud+ with 50 GB storage\nMonthly  $0.99\nBilled to Visa •••• 4417", "verdict": "real", "who": "Parents", "clues": ["Real email.apple.com sender", "Matches a subscription you have", "No link to 'verify' anything"], "lesson": "Don't recognize a charge? Check Settings > Subscriptions on your phone.", "id": 26, "from": "Apple"}, {"kind": "email function mEsc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function mRich(t){
  let h=mEsc(t);
  h=h.replace(/\[([^\]]+)\]/g,'<span class="m-btn">$1</span>');
  h=h.replace(/((?:https?:\/\/)?(?:[a-z0-9-]+\.)+(?:com|net|co|info|top|shop|ly|org|app|xyz|io)(?:\/[^\s<]*)?)/gi,'<span class="m-link">$1</span>');
  return h.replace(/\n/g,"<br>");
}
const M_APP={Instagram:"m-ig",TikTok:"m-tt",Telegram:"m-tg",Snapchat:"m-sc",Discord:"m-dc","Facebook Marketplace":"m-fb",YouTube:"m-yt"};
function renderMsg(c){
  const b=mRich(c.body), f=mEsc(c.from), ac=M_APP[c.app]||"", ini=(f.replace(/[^A-Za-z0-9#+]/g,"")[0]||"?").toUpperCase();
  switch(c.kind){
    case "sms": return `<div class="m m-sms"><div class="m-top"><span class="m-av">${/^[+\d]|^Unknown/.test(c.from)?"#":ini}</span><div><div class="m-from">${f}</div><div class="m-sub">Text message</div></div></div><div class="m-bub">${b}</div></div>`;
    case "email": return `<div class="m m-email"><div class="m-ehead"><div class="m-from">${f}</div><div class="m-addr">&lt;${mEsc(c.addr)}&gt;</div><div class="m-subj">${mEsc(c.subject)}</div></div><div class="m-ebody">${b}</div></div>`;
    case "dm": return `<div class="m m-dm ${ac}"><div class="m-apptag">${mEsc(c.app)}</div><div class="m-top"><span class="m-av m-av-app">${ini}</span><div><div class="m-from">${f}</div><div class="m-sub">Direct message</div></div></div><div class="m-bub">${b}</div></div>`;
    case "comment": return `<div class="m m-cmt ${ac}"><div class="m-apptag">${mEsc(c.app)} · comment on your post</div><div class="m-crow"><span class="m-av m-av-app">${ini}</span><div><span class="m-from">${f}</span> ${b}<div class="m-sub">2m · Reply · ♡</div></div></div></div>`;
    case "game": return `<div class="m m-game"><div class="m-gbar">🎮 ${mEsc(c.app)}</div><div class="m-gline"><span class="m-gname">${f}:</span> ${b}</div></div>`;
    case "popup": return `<div class="m m-pop"><div class="m-ptitle">${f}</div><div class="m-pbody">${b}</div></div>`;
    case "push": return `<div class="m m-push ${ac}"><div class="m-ptop"><span class="m-icon">${ini}</span><span class="m-app">${mEsc(c.app)}</span><span class="m-now">now</span></div><div class="m-pb">${b}</div></div>`;
    case "voicemail": return `<div class="m m-vm"><div class="m-top"><span class="m-av">📞</span><div><div class="m-from">${f}</div><div class="m-sub">Voicemail · 0:21 · transcript</div></div></div><div class="m-wave">▁▃▅▂▆▃▇▂▅▃▁▄▆▂▅▃▇▄▂▅</div><div class="m-vt">${b}</div></div>`;
    case "url": return `<div class="m m-url"><div class="m-dots"><i></i><i></i><i></i></div>${c.note?`<div class="m-sub" style="margin-bottom:8px">${mEsc(c.note)}</div>`:""}<div class="m-bar">🔒 <span>${mEsc(c.body)}</span></div><div class="m-sub" style="margin-top:10px">Where does this address really go?</div></div>`;
  }
}

const S={aud:"All",mode:"solo",len:10,deck:[],i:0,score:0,streak:0,right:0,missed:[],teams:[0,0]};
const $=s=>document.querySelector(s),app=$("#app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function home(){
  document.body.classList.remove("present");
  app.innerHTML=`<h1 class="title"><span class="f">Fake</span><span class="o">or</span><span class="r">Real?</span></h1>
  <p class="lede">Emails, texts, Instagram, TikTok, Telegram, games and pop-ups modeled on real ones. Can you tell which ones are traps?</p>
  <div class="hint" style="margin-top:16px;font-weight:700">Who's playing?</div>
  <div class="seg" role="group" aria-label="Deck">${["All","Kids","Teens","Parents"].map(a=>`<button data-a="${a}" aria-pressed="${S.aud===a}">${a}</button>`).join("")}</div>
  <div class="hint" style="margin-top:12px;font-weight:700">How many cards?</div>
  <div class="seg" role="group" aria-label="Round length">${[[10,"Quick 10"],[25,"25"],[999,"Whole deck ("+pool().length+")"]].map(([n,l])=>`<button data-l="${n}" aria-pressed="${S.len===n}">${l}</button>`).join("")}</div>
  <div class="choices">
   <button class="choice" id="solo"><div class="e">📱</div><h3>Play on my phone</h3><p>Tap Fake or Real, build a streak, see what you missed.</p></button>
   <button class="choice" id="pres"><div class="e">📺</div><h3>Play as a room</h3><p>Big-screen mode for the workshop. Two teams shout it out, you reveal.</p></button>
  </div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.len=+b.dataset.l;home()});app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{S.aud=b.dataset.a;home()});
  $("#solo").onclick=()=>begin("solo");$("#pres").onclick=()=>begin("present");
}
function pool(){return S.aud==="All"?CARDS:CARDS.filter(c=>c.who==="Everyone"||c.who.includes(S.aud))}
function begin(m){Object.assign(S,{mode:m,deck:shuffle(pool()).slice(0,S.len),i:0,score:0,streak:0,right:0,missed:[],teams:[0,0]});
  document.body.classList.toggle("present",m==="present");show();}
function hudHtml(){return S.mode==="solo"
  ?`<div class="hud"><span class="t">Card ${S.i+1} of ${S.deck.length}</span><span class="pill">🔥 ${S.streak}</span><span class="pill">⭐ ${S.score}</span></div>`
  :`<div class="hud"><span class="t">Card ${S.i+1} of ${S.deck.length}</span><button class="pill" id="quit">End game</button></div>`}
function show(){
  window.scrollTo(0,0);const c=S.deck[S.i];
  app.innerHTML=hudHtml()+`<div class="stage"><div class="frame"><div class="meta"><span>For: ${c.who}</span><span>#${c.id}</span></div>${renderMsg(c)}</div><div id="st"></div></div>
   ${S.mode==="solo"?`<div class="btns" id="btns"><button class="vote fk" data-v="fake">Fake</button><button class="vote rl" data-v="real">Real</button></div>`
   :`<div class="row" id="btns"><button class="big" id="rv">Reveal</button><span class="hint">Everyone votes first: thumbs down for fake, thumbs up for real.</span></div>`}
   <div id="out"></div>`;
  if(S.mode==="solo")app.querySelectorAll(".vote").forEach(b=>b.onclick=()=>reveal(b.dataset.v));
  else{$("#rv").onclick=()=>reveal(null);$("#quit").onclick=end;}
}
function reveal(v){
  const c=S.deck[S.i],ok=v===c.verdict;
  $("#st").innerHTML=`<div class="stamp ${c.verdict}">${c.verdict==="fake"?"FAKE":"REAL"}</div>`;
  $("#btns").remove();
  let head="";
  if(S.mode==="solo"){ if(ok){S.right++;S.streak++;S.score+=100+Math.min(S.streak-1,4)*20;head=["Spotted it!","Scam radar on point!","Correct!"][S.i%3]}
    else{S.streak=0;S.missed.push(c);head="Got you this time"} }
  else head=c.verdict==="fake"?"It's a trap!":"This one's legit";
  const last=S.i===S.deck.length-1;
  $("#out").innerHTML=`<div class="reveal"><h2>${head}</h2><div style="font-weight:700">${c.verdict==="fake"?"Clues it's fake:":"Why it checks out:"}</div>
    <ul>${c.clues.map(x=>`<li>${mEsc(x)}</li>`).join("")}</ul><div class="lesson">💡 ${mEsc(c.lesson)}</div></div>
    ${S.mode==="present"?`<div class="teams">${[0,1].map(t=>`<div class="team"><div class="n">Team ${t?"Real Deal":"Scam Busters"}</div><div class="s" id="ts${t}">${S.teams[t]}</div><button data-t="${t}">+1</button></div>`).join("")}</div>`:""}
    <button class="big" id="nx">${last?"See results":"Next card"}</button>`;
  if(S.mode==="solo"){const h=app.querySelector(".hud");h.outerHTML=hudHtml();}
  app.querySelectorAll(".team button").forEach(b=>b.onclick=()=>{S.teams[+b.dataset.t]++;$("#ts"+b.dataset.t).textContent=S.teams[+b.dataset.t]});
  $("#nx").onclick=()=>{if(last)end();else{S.i++;show()}};
}
function end(){
  window.scrollTo(0,0);
  if(S.mode==="present"){const w=S.teams[0]===S.teams[1]?"It's a tie!":`Team ${S.teams[0]>S.teams[1]?"Scam Busters":"Real Deal"} wins!`;
    app.innerHTML=`<h1 class="title"><span class="f" style="font-size:clamp(50px,12vw,100px)">${w}</span></h1>
    <div class="teams"><div class="team"><div class="n">Scam Busters</div><div class="s">${S.teams[0]}</div></div><div class="team"><div class="n">Real Deal</div><div class="s">${S.teams[1]}</div></div></div>
    <p class="lede" style="margin-top:18px">The move that beats almost every card: stop, don't click, and check another way.</p><button class="big" id="hm">Play again</button>`;
  }else{const p=S.right/S.deck.length;
    const r=p===1?"Scam Slayer 🏆":p>=.8?"Scam Spotter 🕵️":p>=.6?"Getting Sharp 🔍":"Scammers' Favorite (for now) 🎣";
    app.innerHTML=`<div class="hint" style="margin-top:20px">You got ${S.right} of ${S.deck.length}</div><div class="score">${S.score}</div><h2 style="font-size:32px">${r}</h2>
    ${S.missed.length?`<h3 style="margin-top:22px;font-size:22px">The ones that fooled you</h3><div class="missed">${S.missed.map(c=>`<div><b>#${c.id} was ${c.verdict}.</b> ${mEsc(c.lesson)}</div>`).join("")}</div>`:`<p class="lede">Perfect round. Go teach your family.</p>`}
    <div class="row"><button class="big" id="hm">Play again</button></div>`;}
  $("#hm").onclick=home;
}
home();
</script>
</body>
</html>
